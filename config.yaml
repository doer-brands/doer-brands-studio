brand:
  handle: '@doer_brands'
  series: RELATIONAL LEADERSHIP
  default_theme: dark
  alternate_themes: true
posting:
  queue_target: 7
  carousel: true
  verified_ratio: 0.2
  similarity_limit: 0.55
pillars:
- name: Trust
  idea: Trust is built through small, kept commitments and consistency between words and actions.
  lane: relational
- name: Listening
  idea: Listening to understand, not to respond; making people feel heard before solving.
  lane: relational
- name: Curiosity
  idea: Genuine interest in people's experience, strengths, and context.
  lane: relational
- name: Vulnerability
  idea: Admitting mistakes and gaps; psychological safety starts with the leader going first.
  lane: relational
- name: Accountability
  idea: High standards held within a caring relationship; clear expectations as kindness.
  lane: relational
- name: Presence
  idea: Undivided attention; being fully there in one-on-ones and everyday moments.
  lane: relational
- name: Appreciation
  idea: Specific, timely recognition that shows people their work matters.
  lane: relational
- name: Courageous Conversations
  idea: Saying the hard thing early, privately, and with care; clarity as kindness.
  lane: relational
- name: Bold
  lane: doer
  idea: Deciding and moving before you feel ready; courage as a small decision repeated; saying it out loud and backing it with work.
- name: Empowered
  lane: doer
  idea: Owning your choices and next step; focusing on what you control; giving others room and trust to act.
- name: Doer
  lane: doer
  idea: Action over intention; showing up in training, work, and building something; effort over applause; the man in the arena who is willing to try and fail.
lanes:
  relational:
    weight: 0.6
    series: RELATIONAL LEADERSHIP
