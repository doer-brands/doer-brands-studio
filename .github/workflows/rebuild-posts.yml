name: 6 - Refresh waiting posts after a wording change
# Re-creates the graphics and captions of posts that are not posted yet, using the latest config.yaml. IDs and approvals stay the same.
on:
  workflow_dispatch: {}
concurrency: queue
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-liberation
      - run: python -m rl_studio.cli rebuild
      - run: |
          git config user.name "rl-bot"; git config user.email "rl-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "refresh waiting posts"
          git pull --rebase
          git push
