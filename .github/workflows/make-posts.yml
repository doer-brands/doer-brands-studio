name: 1 - Make posts
# Click "Run workflow" to generate a batch of posts for you to review.
on:
  workflow_dispatch:
    inputs:
      n:
        description: "How many posts to make"
        required: true
        default: "7"
concurrency: queue
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      N: ${{ inputs.n }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-liberation
      - run: python -m rl_studio.cli make --n "$N"
      - name: Save to repo
        run: |
          git config user.name "rl-bot"; git config user.email "rl-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "new posts for review"
          git pull --rebase
          git push
